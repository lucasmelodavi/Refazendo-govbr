<body>
    <div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
      <div class="login-card">
        <h2 class="fw-bold text-center mb-4"> Digite sua Senha </h2>
        <p>CPF: <span id="mostrarCpf"></span></p>
        
        <p> Senha: </p>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<div class="senha-container">
    <input type="password" id="senha" placeholder="Digite sua senha">

    <button type="button" id="btnOlho" onclick="mostrarSenha()">
        <i id="iconeOlho" class="bi bi-eye-fill"></i>
    </button>
</div>

<div class="botoes">
    <button id="btnEntrar">Entrar</button>
    <button id="btnCancelar">Cancelar</button>
</div>

<script>
function mostrarSenha() {
    const senha = document.getElementById("senha");
    const icone = document.getElementById("iconeOlho");

    if (senha.type === "password") {
        senha.type = "text";
        icone.className = "bi bi-eye-fill";
    } else {
        senha.type = "password";
        icone.className = "bi bi-eye-slash-fill";
    }
}

const senha = document.getElementById("senha");
const btnContinuar = document.getElementById("btnContinuar");

senha.addEventListener("input", function() {
    btnentrar.disabled = senha.value.trim() === "";
});

function entar() {
    alert("Senha preenchida!");
}

</script>
